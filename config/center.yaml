# Настройки центра. Локальные изменения — в config/local.yaml (не хранится в git), он перекрывает этот файл.

# Оборудование на объектах: камеры (MJPEG) и дорожные контроллеры (HTTP).
# Сейчас это эмулятор участка; для реального объекта — адрес шлюза оборудования.
equipment:
  base_url: http://127.0.0.1:8100
  heartbeat_s: 5

# Детектор объектов на видео.
detector:
  model: yolo11s.pt      # веса YOLO; после дообучения на кадрах объекта — путь к своим весам
  imgsz: 960
  conf: 0.2
  device: 0              # номер видеокарты или cpu
  fps_per_camera: 3      # сколько кадров в секунду с каждой камеры обрабатывать

server:
  host: 127.0.0.1
  port: 8000
