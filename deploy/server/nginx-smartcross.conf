# Вход снаружи только через nginx с паролем. Сами службы слушают 127.0.0.1.
#   http://<сервер>/       — админка (центр)
#   http://<сервер>:8080/  — эмулятор: карта, камеры, API
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    auth_basic "SmartCross";
    auth_basic_user_file /etc/nginx/smartcross.htpasswd;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # видео MJPEG и живые данные — без задержки
        proxy_read_timeout 1h;
    }
}

server {
    listen 8080;
    server_name _;
    auth_basic "SmartCross";
    auth_basic_user_file /etc/nginx/smartcross.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
