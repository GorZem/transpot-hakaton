# Вход снаружи только через nginx и PIN-код (deploy/server/gate.py). Сами службы слушают 127.0.0.1.
#   http://<сервер>/       — админка (центр)
#   http://<сервер>:8080/  — эмулятор: карта, камеры, API
# map и limit_req_zone ниже использует и sites-available/smartcross-domains (домены с HTTPS): не переименовывать
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# защита от перебора PIN: не больше 10 запросов к странице входа в минуту с одного адреса
limit_req_zone $binary_remote_addr zone=pinlogin:1m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8090/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gate-Site admin;
    }
    location /__gate/ {
        limit_req zone=pinlogin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Gate-Site admin;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location @pin {
        return 302 /__gate/login?next=$request_uri;
    }
    location / {
        auth_request /__gate_check;
        error_page 401 = @pin;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # видео MJPEG и живые данные — без задержки
        proxy_read_timeout 1h;
    }
}

server {
    listen 8080;
    server_name _;

    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8090/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gate-Site emulator;
    }
    location /__gate/ {
        limit_req zone=pinlogin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Gate-Site emulator;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location @pin {
        return 302 /__gate/login?next=$request_uri;
    }
    location / {
        auth_request /__gate_check;
        error_page 401 = @pin;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
