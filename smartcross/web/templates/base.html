<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCross — {{ site }}</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◉</span> SmartCross <span class="muted">· {{ site }}</span></div>
  <nav>
    <a href="/" class="{{ 'active' if page == 'dashboard.html' }}">Мониторинг</a>
    <a href="/config" class="{{ 'active' if page == 'config.html' }}">Настройка</a>
    <a href="/stats" class="{{ 'active' if page == 'stats.html' }}">Статистика</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/common.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
