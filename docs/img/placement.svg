<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif" font-size="13">
  <rect width="900" height="520" fill="#f4f5f7"/>
  <!-- sidewalks -->
  <rect x="0" y="60" width="900" height="80" fill="#d9dde3"/>
  <rect x="0" y="380" width="900" height="80" fill="#d9dde3"/>
  <text x="12" y="85" fill="#555">Тротуар, сторона B</text>
  <text x="12" y="445" fill="#555">Тротуар, сторона A</text>
  <!-- road -->
  <rect x="0" y="140" width="900" height="240" fill="#5b6068"/>
  <line x1="0" y1="260" x2="900" y2="260" stroke="#fff" stroke-width="3" stroke-dasharray="4 0"/>
  <line x1="0" y1="200" x2="900" y2="200" stroke="#fff" stroke-width="2" stroke-dasharray="18 14"/>
  <line x1="0" y1="320" x2="900" y2="320" stroke="#fff" stroke-width="2" stroke-dasharray="18 14"/>
  <!-- zebra -->
  <g fill="#fff">
    <rect x="410" y="146" width="80" height="12"/><rect x="410" y="170" width="80" height="12"/>
    <rect x="410" y="194" width="80" height="12"/><rect x="410" y="218" width="80" height="12"/>
    <rect x="410" y="242" width="80" height="12"/><rect x="410" y="266" width="80" height="12"/>
    <rect x="410" y="290" width="80" height="12"/><rect x="410" y="314" width="80" height="12"/>
    <rect x="410" y="338" width="80" height="12"/><rect x="410" y="362" width="80" height="12"/>
  </g>
  <!-- traffic direction arrows -->
  <g fill="#ffd54a">
    <path d="M60 290 l40 0 l0 -8 l18 14 l-18 14 l0 -8 l-40 0z"/>
    <path d="M60 350 l40 0 l0 -8 l18 14 l-18 14 l0 -8 l-40 0z"/>
    <path d="M840 170 l-40 0 l0 -8 l-18 14 l18 14 l0 -8 l40 0z"/>
    <path d="M840 230 l-40 0 l0 -8 l-18 14 l18 14 l0 -8 l40 0z"/>
  </g>
  <text x="130" y="303" fill="#ffd54a">направление 1</text>
  <text x="690" y="183" fill="#ffd54a">направление 2</text>
  <!-- waiting zones -->
  <rect x="380" y="92" width="140" height="44" fill="#ffc800" fill-opacity=".35" stroke="#e0a800"/>
  <text x="392" y="119" fill="#6b5200">зона ожидания B</text>
  <rect x="380" y="384" width="140" height="44" fill="#ffc800" fill-opacity=".35" stroke="#e0a800"/>
  <text x="392" y="411" fill="#6b5200">зона ожидания A</text>
  <!-- approach zones -->
  <rect x="120" y="262" width="280" height="116" fill="#1e7bff" fill-opacity=".22" stroke="#1e7bff" stroke-dasharray="6 4"/>
  <text x="150" y="370" fill="#ffffff">зона подхода 1 (40–60 м)</text>
  <rect x="500" y="142" width="280" height="116" fill="#1e7bff" fill-opacity=".22" stroke="#1e7bff" stroke-dasharray="6 4"/>
  <text x="560" y="160" fill="#ffffff">зона подхода 2 (40–60 м)</text>
  <line x1="395" y1="262" x2="395" y2="378" stroke="#e000e0" stroke-width="3"/>
  <line x1="505" y1="142" x2="505" y2="258" stroke="#e000e0" stroke-width="3"/>
  <!-- camera FOV -->
  <path d="M560 400 L40 355 L455 62 Z" fill="#2fbf71" fill-opacity=".13" stroke="#2fbf71"/>
  <path d="M340 120 L860 165 L445 458 Z" fill="#ef4b4b" fill-opacity=".10" stroke="#ef4b4b"/>
  <!-- poles & cameras -->
  <circle cx="560" cy="400" r="9" fill="#222"/>
  <rect x="566" y="386" width="22" height="12" rx="2" fill="#2fbf71" transform="rotate(-150 566 392)"/>
  <text x="575" y="420" font-weight="bold">Опора 1 + Камера 1</text>
  <text x="575" y="436" fill="#555">светофорная опора стороны A, h≈6 м</text>
  <circle cx="340" cy="120" r="9" fill="#222"/>
  <rect x="330" y="110" width="22" height="12" rx="2" fill="#ef4b4b" transform="rotate(30 334 116)"/>
  <text x="120" y="42" font-weight="bold">Опора 2 + Камера 2</text>
  <text x="120" y="56" fill="#555">светофорная опора стороны B, h≈6 м</text>
  <line x1="200" y1="58" x2="332" y2="114" stroke="#999"/>
  <!-- legend -->
  <g transform="translate(470,472)">
    <rect width="12" height="12" fill="#2fbf71" fill-opacity=".4"/><text x="18" y="11">обзор камеры 1: сторона B, переход, подход 1</text>
    <rect y="20" width="12" height="12" fill="#ef4b4b" fill-opacity=".3"/><text x="18" y="31">обзор камеры 2: сторона A, переход, подход 2</text>
  </g>
</svg>
